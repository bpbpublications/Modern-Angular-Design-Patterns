<div class="layout">
  <aside class="sidebar">
    <a class="brand" routerLink="/">
      <span class="brand-title">Modern Angular</span>
      <span class="brand-subtitle">Design Patterns</span>
    </a>
    <nav class="nav">
      @for (chapter of chapters; track chapter.number) {
        <a
          class="nav-link"
          [routerLink]="['/', chapter.slug]"
          routerLinkActive="active"
        >
          <span class="nav-number">{{ chapter.number }}</span>
          <span class="nav-title">{{ chapter.title }}</span>
        </a>
      }
    </nav>
  </aside>
  <main class="content">
    <router-outlet />
  </main>
</div>
